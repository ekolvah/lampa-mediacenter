minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-push]
repos:
  # agent-process:begin
  - repo: https://github.com/ekolvah/agent-process-distribution
    rev: v3.28.0
    hooks:
      - id: quality
  # agent-process:end
  # The baseline toolchain, this repository's own: edit-time lint runs the `pre-commit` stage
  # on the edited file; the declared `test` runs the `manual` stage at push and in CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # Правила — только в pyproject.toml, без аргументов здесь: иначе их два набора.
      - id: ruff-check
        stages: [pre-commit, manual]
      - id: ruff-format
        stages: [pre-commit, manual]
  # No arguments: an import mypy cannot resolve fails until its types are listed here.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        args: []
        stages: [pre-commit, manual]
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.9
    hooks:
      - id: pylint
        args: [--disable=all, --enable=too-many-lines, --max-module-lines=1000]
        stages: [pre-commit, manual]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        stages: [pre-commit, manual]
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        name: pip-audit requirements.txt
        args: [-r, requirements.txt]
        files: ^requirements\.txt$
        stages: [manual]
      - id: pip-audit
        name: pip-audit requirements-dev.txt
        args: [-r, requirements-dev.txt]
        files: ^requirements-dev\.txt$
        stages: [manual]
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: unsupported
        pass_filenames: false
        files: (^|/)(test_[^/]*|[^/]*_test)\.py$
        stages: [manual]
      # Проверки проекта, которых в базовом наборе нет (docs/quality-gates.md). ci_check
      # повторно зовёт detect-secrets с `-X utf8`: хук выше без UTF-8 режима на Windows
      # молча пропускает файлы с кириллицей, а секрет обязан ловиться до push.
      - id: ci-check
        name: ci_check (секреты, снапшоты, TorrServer, ссылки)
        entry: python scripts/ci_check.py
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]
