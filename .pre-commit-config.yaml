minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-push]
repos:
  # agent-process:begin
  - repo: https://github.com/ekolvah/agent-process-distribution
    rev: v3.28.0
    hooks:
      - id: quality
  # agent-process:end
  # The baseline toolchain, this repository's own: edit-time lint runs the `pre-commit` stage
  # on the edited file; the declared `test` runs the `manual` stage at push and in CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--extend-select=C901,PLR0911,PLR0912,PLR0913,PLR0915"]
        stages: [pre-commit, manual]
      - id: ruff-format
        stages: [pre-commit, manual]
  # No arguments: an import mypy cannot resolve fails until its types are listed here.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        args: []
        stages: [pre-commit, manual]
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.9
    hooks:
      - id: pylint
        args: [--disable=all, --enable=too-many-lines, --max-module-lines=1000]
        stages: [pre-commit, manual]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        stages: [pre-commit, manual]
  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        name: pip-audit requirements.txt
        args: [-r, requirements.txt]
        files: ^requirements\.txt$
        stages: [manual]
      - id: pip-audit
        name: pip-audit requirements-dev.txt
        args: [-r, requirements-dev.txt]
        files: ^requirements-dev\.txt$
        stages: [manual]
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: unsupported
        pass_filenames: false
        files: (^|/)(test_[^/]*|[^/]*_test)\.py$
        stages: [manual]
  # Проверки scripts/ci_check.py, которых нет в базовом наборе выше (обоснование каждой —
  # docs/quality-gates.md). Дефолтный detect-secrets токен внутри URL не видит, поэтому
  # `secrets` и `remote` (снапшоты с живыми кредами в индексе) обязаны идти до push.
  - repo: local
    hooks:
      - id: ci-check-remote
        name: ci_check remote
        entry: python scripts/ci_check.py --only remote
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: ci-check-secrets
        name: ci_check secrets
        entry: python scripts/ci_check.py --only secrets
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: ci-check-snapshots
        name: ci_check snapshots
        entry: python scripts/ci_check.py --only snapshots
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: ci-check-torrserver
        name: ci_check torrserver
        entry: python scripts/ci_check.py --only torrserver
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: ci-check-links
        name: ci_check links
        entry: python scripts/ci_check.py --only links
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [manual]
